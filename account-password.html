<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Установить пароль — Elseborn</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="account-v11.css"></head><body><main class="wrap section" style="max-width:490px;margin:8vh auto"><div class="panel"><h1>Пароль Elseborn</h1><p>Установи новый пароль для сайта и лаунчера.</p><form id="pw-form"><div class="formrow"><label>Новый пароль</label><input id="pw1" type="password" minlength="8" required></div><div class="formrow"><label>Повтори пароль</label><input id="pw2" type="password" minlength="8" required></div><button type="submit">Сохранить пароль</button></form><p id="pw-message" role="status"></p><a href="index.html">Вернуться на сайт</a></div></main><script type="module">import {supabase} from './supabase-client.js';const form=document.querySelector('#pw-form'),msg=document.querySelector('#pw-message');form.onsubmit=async e=>{e.preventDefault();const p=document.querySelector('#pw1').value;if(p!==document.querySelector('#pw2').value){msg.textContent='Пароли не совпадают';return}const {data:{session}}=await supabase.auth.getSession();if(!session){msg.textContent='Открой ссылку из письма для восстановления пароля.';return}const {error}=await supabase.auth.updateUser({password:p});msg.textContent=error?error.message:'Пароль сохранён. Теперь можно входить по почте или нику.'};</script></body></html>
